<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastra-se</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>
<body class="bg-dark">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-md-8 col-lg-5 col-xl-4">

                <div class="card border-0 shadow-lg rounded-4">

                     <div class="card-body p-4 p-md-5">

                        <div class="text-center" mb-4>

                            <h2 class="fw-bold">Crie sua conta
                            </h2>

                            <p class="text-secondary"> Comece seu cadastro já!
                            </p>

                        </div>

                        <form>
                            <div class="mb-3">
                                <label class="form-label" fw-semibold>
                                    Nome:
                                </label>
                                <input type="name" class="form-control form-control-lg"
                                placeholder="digite seu Nome">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" fw-semibold>
                                    E-mail:
                                </label>
                                <input type="email" class="form-control form-control-lg"
                                placeholder="example@email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" fw-semibold>
                                    Senha:
                                </label>
                                <input type="password" class="form-control form-control-lg"
                                placeholder="digite sua senha">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" fw-semibold>
                                    Confirme sua senha:
                                </label>
                                <input type="password" class="form-control form-control-lg"
                                placeholder="confirmar senha">
                            
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100"> Cadastrar</button>

                        </form>

                     </div>
                     <div class="text-center mb-4">
                        <p class="fw-semibold"> Já tem uma conta?</p> 
                        <a href="./login.html" class="text-center">Faça o login</a>
                      </div>


                </div>

            </div>



        </div>


    </div>



    
    





    
     <script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
